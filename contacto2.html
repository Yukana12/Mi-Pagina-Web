<h2 class="subtitulo">Formulario de contacto</h2>
    <form action="" method="post">
        <label for="nombre">Nombre</label>
        <input type="text" name="nombre" id="nombre" 
        placeholder="Ingrese su nombre" required>

        <label for="apellido">Apellido</label>
        <input type="text" name="apellido" id="apellido" 
        placeholder="Ingrese su apellido" required>

        <label for="fecha">Fecha de Contacto</label>
        <input type="date" name="fecha" id="fecha">

        <label for="horario">Horario de Contacto</label>
        <select name="horario" id="horario">
            <option value="Mañana">Mañana</option>
            <option value="Tarde">Tarde</option>
            <option value="Noche">Noche</option>
        </select>

        <div class="botones">
            <input class="btn btn-alt" type="reset" name="Limpiar" id="limpiar" value="Limpiar">
            <input class="btn" type="submit" name="Enviar" id="enviar" value="Enviar">
        </div>

    </form>
    
</body>
